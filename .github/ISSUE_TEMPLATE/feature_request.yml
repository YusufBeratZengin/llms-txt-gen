name: Feature request
description: Propose an improvement.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired CLI or API behavior with a small example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
